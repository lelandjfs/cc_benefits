name: Weekly benefits sync

on:
  schedule:
    - cron: "0 13 * * MON"   # 6am PT Monday
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore transaction cache
        uses: actions/cache@v4
        with:
          path: transactions_cache.json
          key: plaid-txn-cache

      - run: pip install -r requirements.txt

      - name: Sync Plaid transactions + compute benefit usage
        env:
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ secrets.PLAID_ENV }}
          PLAID_ACCESS_TOKENS: ${{ secrets.PLAID_ACCESS_TOKENS }}
        run: python3 plaid_sync.py

      - name: Push usage into Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python3 sheet_updater.py

      - name: Commit updated cache + outputs
        run: |
          git config user.name "benefits-bot"
          git config user.email "actions@users.noreply.github.com"
          git add transactions_cache.json benefits_usage.json summary.md
          git diff --cached --quiet || git commit -m "Weekly benefits sync $(date -u +%F)"
          git push
