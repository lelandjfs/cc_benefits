name: Benefits review

# Card issuers change benefit terms/values over time. This uses the Parallel
# Task API to research each benefit's current official terms and diff them
# against RULES in benefits_engine.py, then opens a tracking issue with the
# findings. Deliberately does NOT auto-edit benefits_engine.py — see
# check_benefits.py for why.

on:
  schedule:
    - cron: "0 15 1 3,9 *"   # 8am PT, March 1 and September 1
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Research current benefit terms via Parallel
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: python3 check_benefits.py

      - name: Open review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Semiannual benefits review — $(date -u +%Y-%m-%d)" \
            --body-file benefits_review_report.md
