name: Benefits review reminder

# Card issuers change benefit terms/values over time. This can't be verified
# by a script — it needs someone (or an LLM with web search) to check the
# current official terms against RULES in benefits_engine.py. This job just
# opens a tracking issue twice a year; the actual check happens when that
# issue is picked up (e.g. by pointing Claude Code at it).

on:
  schedule:
    - cron: "0 15 1 3,9 *"   # 8am PT, March 1 and September 1
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Semiannual benefits review — $(date -u +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
          Time to verify the benefit rules in \`benefits_engine.py\` are still accurate.

          For each rule in \`RULES\` (Amex Gold + Chase Sapphire Reserve):
          - [ ] Confirm \`period_value\` (dollar amount) still matches the issuer's current terms
          - [ ] Confirm \`period\` (monthly/semiannual/annual) hasn't changed
          - [ ] Confirm the benefit still exists at all (issuers retire/replace credits)
          - [ ] Check for any *new* benefits not yet in \`RULES\`
          - [ ] Check \`merchant_regex\`/\`credit_regex\` still match how the issuer posts these (e.g. merchant name changes)

          Sources: the official Amex Gold and Chase Sapphire Reserve benefits guides (amex.com / chase.com), not third-party blogs.

          If anything changed, update \`benefits_engine.py\` and open a PR.
          EOF
          )"
