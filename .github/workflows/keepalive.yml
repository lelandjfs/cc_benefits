name: Keepalive

# GitHub disables scheduled workflows in public repos after 60 days with no
# repository activity (commits). weekly.yml and heartbeat.yml no longer commit
# anything, so this makes one tiny commit a month to keep schedules alive.
# Times are UTC; 16:17 UTC = 9:17am PDT / 8:17am PST.

on:
  schedule:
    - cron: "17 16 1 * *"   # 1st of each month, 9:17am PDT (8:17am PST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update keepalive stamp
        run: |
          set -euo pipefail
          echo "last keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive

      - name: Commit and push (skip if unchanged)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          git commit -m "chore: monthly keepalive [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
